services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: maeto-timescaledb
    environment:
      - POSTGRES_PASSWORD=admin
    volumes:
      - ./db/init/:/docker-entrypoint-initdb.d/
      - maeto-db:/var/lib/postgresql/data
    ports:
      - 5435:5432

  # NATS moved to Containerlab ( deploy/generator/render_clab.py )

  maeto-control-plane:
    image: maeto-control-plane:latest
    container_name: maeto-control-plane
    build:
      context: .
      dockerfile: docker/maeto-control-plane.Dockerfile
      args:
        DEBUG: ${DEBUG:-0}
    environment:
      - OTEL_SINK=stdout
      - OTEL_ENDPOINT=otel-collector:4318
      - CONTROL_PLANE_LISTEN_ADDRESS=:8080
      - CONTROL_PLANE_DATA_DIR=/app/data/
      - CONTROL_PLANE_STATE_DIR=/app/state/latest.json
      - MAETO_DB_URL=postgres://postgres:admin@db:5432/postgres?sslmode=disable
      - NATS_CONNECT_URL=nats://clab-eight-pop-nats:4222
      - AGENT_HEARTBEAT_INTERVAL=30s
      # set MAETO_DLV_LISTEN=[::]:2345 to start under delve
      - MAETO_DLV_LISTEN=${MAETO_DLV_LISTEN:-}
    ports:
      - "2345:2345"
    volumes:
      - ./build/:/app/data/
      - ./.state/:/app/state/
    depends_on:
      - db
    networks:
      - default
      - clab

  maeto-pane:
    image: maeto-pane:latest
    container_name: maeto-pane
    build:
      context: .
      dockerfile: docker/maeto-pane.Dockerfile
      args:
        ELIXIR_VERSION: ${ELIXIR_VERSION:-1.19.5}
        OTP_VERSION: ${OTP_VERSION:-28.5}
        DEBIAN_VERSION: ${DEBIAN_VERSION:-trixie-20260421-slim}
    environment:
      - NATS_CONNECT_URL=nats://clab-eight-pop-nats:4222
      - PGHOST=db
      - PGUSER=postgres
      - PGPASSWORD=admin
      - PGDATABASE=postgres
    ports:
      - "5000:4000"
    volumes:
      - ./services/maeto-pane:/app
      - maeto-pane-build:/app/_build
      - maeto-pane-deps:/app/deps
    depends_on:
      - db
    networks:
      - default
      - clab



networks:
  clab:
    external: true

volumes:
  maeto-pane-build:
  maeto-pane-deps:
  nats-nui-db:
  maeto-db:
    name: maeto-db
