services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: maeto-timescaledb
    environment:
      - POSTGRES_PASSWORD=admin
    volumes:
      - ./db/init/:/docker-entrypoint-initdb.d/
    ports:
      - 5435:5432

  # NATS moved to Containerlab ( deploy/generator/render_clab.py )

  maeto-argus:
    image: maeto-argus:latest
    container_name: maeto-argus
    build:
      context: .
      dockerfile: docker/maeto-argus.Dockerfile
    ports:
      - 8087:8080
    environment:
      - OTEL_SINK=otel
      - OTEL_ENDPOINT=otel-collector:4318
      - DETECTION_INTERVAL_SECONDS=10
      - maeto_DB_URL=postgres://postgres:admin@db:5432/postgres?sslmode=disable
      - NATS_CONNECT_URL=nats://nats-server:4222
    depends_on:
      - db

  maeto-control-plane:
    image: maeto-control-plane:latest
    container_name: maeto-control-plane
    build:
      context: .
      dockerfile: docker/maeto-control-plane.Dockerfile
    environment:
      - OTEL_SINK=stdout
      - OTEL_ENDPOINT=otel-collector:4318
      - CONTROL_PLANE_LISTEN_ADDRESS=:8080
      - CONTROL_PLANE_DATA_DIR=/app/data/
      - CONTROL_PLANE_STATE_DIR=/app/state/latest.json
      - MAETO_DB_URL=postgres://postgres:admin@db:5432/postgres?sslmode=disable
      - NATS_CONNECT_URL=nats://clab-eight-pop-nats:4222
      - AGENT_HEARTBEAT_INTERVAL=30s
    volumes:
      - ./build/:/app/data/
      - ./.state/:/app/state/
    depends_on:
      - db
    networks:
      - default
      - clab

networks:
  clab:
    external: true
