[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; lets the clab exec sequence start xdp-bfd once the core links exist
[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:nft-monitor]
command=/usr/local/bin/maeto-monitor nft
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/maeto/nft-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:ip-monitor]
command=/usr/local/bin/maeto-monitor ip
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/maeto/ip-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:charon]
command=/usr/lib/strongswan/charon
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent]
command=/usr/local/bin/maeto-launch /usr/local/bin/maeto-agent
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xdp-bfd]
command=/usr/local/sbin/xdp-bfd --dplane 50700 --kernel-tx eth2
; started from the clab exec sequence: eth2 does not exist until clab wires
; the links, and bfdd needs the data plane listening before it starts
autostart=false
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
