[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:portal]
command=/usr/local/bin/maeto-portal
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:charon]
command=/usr/lib/strongswan/charon
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
