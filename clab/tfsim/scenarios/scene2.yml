# rates are totals per flow; tfsim splits them across streams
# The scenario must match tenant ids and host names with the
#    topology that's running

title: Busy tenants
description: "Two minutes of class-marked traffic: video peaks, hub-and-spoke voice for a gold tenant and best-effort bulk transfers."

duration: 120

defaults:
  protocol: udp
  length: 1200
  streams: 1

flows:
  # Constant 7.5M load from cSEA -> cLAX
  - from: cSEA
    to: cLAX
    rate: 7.5M

  # Constant 2.5M load form cLAX -> cSEA
  - from: cLAX
    to: cSEA
    rate: 2.5M

  # For all sites of tenant 231, have 1M load for each pair
  - mesh: 231
    rate: 1M

  # 7.5M load from cSEA3 -> cNYC2 starting t=40s and ends at t=80s
  - from: cSEA3
    to: cNYC2
    rate: 7.5M
    start: 40
    duration: 40

  # ---- Tenant 273 (gold): voice + streaming on top of the bulk flows above ----
  # Voice call aggregate between HQ sites (EF, small packets)
  - from: cSEA
    to: cLAX
    rate: 300k
    dscp: 46
    length: 200
  - from: cLAX
    to: cSEA
    rate: 300k
    dscp: 46
    length: 200

  # Video conference / streaming peak from t=20s to t=80s
  - from: cSEA
    to: cLAX
    rate: 4M
    dscp: 34
    start: 20
    duration: 60

  # ---- Tenant 305 (gold): hub-and-spoke around cDEN ----
  # Branches stream video to the hub
  - from: cSFO
    to: cDEN
    rate: 6M
    dscp: 34
  - from: cSLC
    to: cDEN
    rate: 4.5M
    dscp: 34
  - from: cIAD
    to: cDEN
    rate: 3M
    dscp: 34
    start: 20
    duration: 80

  # Hub sends return traffic
  - from: cDEN
    to: cSFO
    rate: 1M
  - from: cDEN
    to: cSLC
    rate: 1M

  # Voice between hub and each branch
  - from: cSFO
    to: cDEN
    rate: 200k
    dscp: 46
    length: 200
  - from: cSLC
    to: cDEN
    rate: 200k
    dscp: 46
    length: 200
  - from: cIAD
    to: cDEN
    rate: 200k
    dscp: 46
    length: 200

  # Nightly-backup style bulk transfer, default class, t=60s to t=90s
  - from: cDEN
    to: cIAD
    rate: 10M
    start: 60
    duration: 30

  # ---- Tenant 412 (silver): voice mesh + best-effort bulk ----
  # Voice between every pair of sites
  - mesh: 412
    rate: 250k
    dscp: 46
    length: 200

  # Bulk file sync, default class
  - from: cORD
    to: cNYC
    rate: 5M
    start: 30
    duration: 60
  - from: cSFO2
    to: cORD
    rate: 4M
  - from: cSLC2
    to: cNYC
    rate: 2M
    start: 10
    duration: 100

  # ---- Tenant 518 (gold): streaming-heavy, mostly east side ----
  # Voice between every pair of sites
  - mesh: 518
    rate: 150k
    dscp: 46
    length: 200

  # Streaming
  - from: cLAX2
    to: cORD2
    rate: 10M
    dscp: 34
  - from: cDEN2
    to: cIAD2
    rate: 7.5M
    dscp: 34
    start: 10
    duration: 90

  # Return traffic
  - from: cORD2
    to: cLAX2
    rate: 1.5M

  # Large bulk burst that crosses the E-F-H segment, t=70s to t=100s
  - from: cIAD2
    to: cDEN2
    rate: 12.5M
    start: 70
    duration: 30
