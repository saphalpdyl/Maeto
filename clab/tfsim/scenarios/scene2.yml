# rates are totals per flow; tfsim splits them across streams
# The scenario must match tenant ids and host names with the
#    topology that's running

duration: 120

defaults:
  protocol: udp
  length: 1200
  streams: 1

flows:
  # Constant 7.5M load from cA -> cC
  - from: cA
    to: cC
    rate: 7.5M

  # Constant 2.5M load form cC -> cA
  - from: cC
    to: cA
    rate: 2.5M

  # For all sites of tenant 231, have 1M load for each pair
  - mesh: 231
    rate: 1M

  # 7.5M load from cA3 -> cA4 starting t=40s and ends at t=80s
  - from: cA3
    to: cA4
    rate: 7.5M
    start: 40
    duration: 40

  # ---- Tenant 273 (gold): voice + streaming on top of the bulk flows above ----
  # Voice call aggregate between HQ sites (EF, small packets)
  - from: cA
    to: cC
    rate: 300k
    dscp: 46
    length: 200
  - from: cC
    to: cA
    rate: 300k
    dscp: 46
    length: 200

  # Video conference / streaming peak from t=20s to t=80s
  - from: cA
    to: cC
    rate: 4M
    dscp: 34
    start: 20
    duration: 60

  # ---- Tenant 305 (gold): hub-and-spoke around cE ----
  # Branches stream video to the hub
  - from: cB
    to: cE
    rate: 6M
    dscp: 34
  - from: cD
    to: cE
    rate: 4.5M
    dscp: 34
  - from: cH
    to: cE
    rate: 3M
    dscp: 34
    start: 20
    duration: 80

  # Hub sends return traffic
  - from: cE
    to: cB
    rate: 1M
  - from: cE
    to: cD
    rate: 1M

  # Voice between hub and each branch
  - from: cB
    to: cE
    rate: 200k
    dscp: 46
    length: 200
  - from: cD
    to: cE
    rate: 200k
    dscp: 46
    length: 200
  - from: cH
    to: cE
    rate: 200k
    dscp: 46
    length: 200

  # Nightly-backup style bulk transfer, default class, t=60s to t=90s
  - from: cE
    to: cH
    rate: 10M
    start: 60
    duration: 30

  # ---- Tenant 412 (silver): voice mesh + best-effort bulk ----
  # Voice between every pair of sites
  - mesh: 412
    rate: 250k
    dscp: 46
    length: 200

  # Bulk file sync, default class
  - from: cF
    to: cG
    rate: 5M
    start: 30
    duration: 60
  - from: cB2
    to: cF
    rate: 4M
  - from: cD2
    to: cG
    rate: 2M
    start: 10
    duration: 100

  # ---- Tenant 518 (gold): streaming-heavy, mostly east side ----
  # Voice between every pair of sites
  - mesh: 518
    rate: 150k
    dscp: 46
    length: 200

  # Streaming
  - from: cC2
    to: cF2
    rate: 10M
    dscp: 34
  - from: cE2
    to: cH2
    rate: 7.5M
    dscp: 34
    start: 10
    duration: 90

  # Return traffic
  - from: cF2
    to: cC2
    rate: 1.5M

  # Large bulk burst that crosses the E-F-H segment, t=70s to t=100s
  - from: cH2
    to: cE2
    rate: 12.5M
    start: 70
    duration: 30
