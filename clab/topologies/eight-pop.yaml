# One-way propagation delay per member: great-circle distance x 1.4 fiber route
# factor at 204,000 km/s (~4.9 us/km in glass). A second member stands in for a
# physically diverse route and is 1.3x longer.
links:
  # pe uplinks: every pe to its two nearest p routers
  - a: SEA
    b: SJC # 1120 km
    parallel:
      - bandwidth: 70
        delay: 7.7
        start_jitter: 0.05
  - a: SEA
    b: PHX # 1790 km
    parallel:
      - bandwidth: 50
        delay: 12.3
  - a: SFO
    b: SJC # 50 km
    parallel:
      - bandwidth: 80
        delay: 0.3
  - a: SFO
    b: PHX # 1050 km
