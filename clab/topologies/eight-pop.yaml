# One-way propagation delay per member: great-circle distance x 1.4 fiber route
# factor at 204,000 km/s (~4.9 us/km in glass). A second member stands in for a
# physically diverse route and is 1.3x longer.
links:
  - a: SEA
    b: SFO # 1094 km
    parallel:
