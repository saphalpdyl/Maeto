name: eight-pop

defaults:
  locator_prefix: fc00:0::/32
  mirror_prefix: fc00:f::/32
  link_prefix: fc00:1::/32
  edge_prefix: fd00::/48

# role: pe terminates customer sites (tenant vrfs, cpe tunnels); role: p is core
# only. pes never link to each other: each is dual-homed to two p routers, so a
# pe is never transit and never adjacent to the pe it protects.
nodes:
  - id: SEA # Seattle
    index: 1
    role: pe
    protected_by: [SFO]
  - id: SFO # San Francisco
    index: 2
    role: pe
    protected_by: [LAX]
  - id: LAX # Los Angeles
    index: 3
    role: pe
    protected_by: [SFO]
  - id: SLC # Salt Lake City
    index: 4
    role: pe
    protected_by: [DEN]
  - id: DEN # Denver
    index: 5
    role: pe
    protected_by: [SLC]
  - id: ORD # Chicago
    index: 6
    role: pe
    protected_by: [IAD]
  - id: NYC # New York
    index: 7
    role: pe
    protected_by: [IAD]
  - id: IAD # Ashburn
    index: 8
    role: pe
    protected_by: [NYC]
  - id: SJC # West core, San Jose
    index: 9
    role: p
  - id: PHX # Mountain core, Phoenix
    index: 10
    role: p
  - id: CHI # Central core, Chicago
    index: 11
    role: p
  - id: ASH # East core, Ashburn
    index: 12
    role: p

# label: 0 is the default/bulk low-priority class
classes:
  voice:
    label: 2
    index: 1 # Greater the value, the more priority it has during path computation
    match: { dscp: [46] } # EF, RFC 4594 telephony
    objective: { latency: 0.4, jitter: 0.3, loss: 0.3} # Represents the weight of cost dimension
  streaming:
    label: 3
    index: 2
    match: { dscp: [34, 36, 38] } # AF4 High-assurance class for interactive video and streaming
    objective: {latency: 0.2, jitter: 0.6, loss: 0.2}
#  <class-name>:
#    label: <color>
#    index: <priority>  Higher value means higher priority
#    match: { dscp: [<1..63>, ...] }  Codepoints classified into this class; unmatched traffic is default
#    objective: { <latency,jitter,loss>:  <0 < float64 <= 1.0>}

tiers:
  gold:
    index: 2 # Greater the value, the more priority it has during path computation
    classes: { voice: 0.3, streaming: 0.2 } # Represents the fraction of allocated bandwidth
  silver:
    index: 1
    classes: { voice: 0.2 }
#  <tier-name>:
#    index: <priority>  Higher value means higher priority
#    match: { dscp: [<1..63>, ...] }  Codepoints classified into this class; unmatched traffic is default
#    classes: {<class-name>: <fraction-of-bandwidth-to-allocate>}  Remaining goes to default/bulk class

tenants:
