title: Latency brownout on SJC–PHX
description: "SJC–PHX gains 40 ms each way for two minutes. Watch the probes pick it up and the PCE move latency-sensitive paths around SJC–PHX, then back once it clears."
duration: 150
steps:
  - at: 0
    for: 120
    impair: {link: SJC-PHX, delay_ms: 40, jitter_ms: 3}
