title: Flapping CHI–ASH
description: "CHI–ASH drops for 15 seconds every half minute. The hold-down timer should stop paths from bouncing on and off it each time it returns."
duration: 135
steps:
  - {at: 0, for: 15, down: CHI-ASH}
  - {at: 30, for: 15, down: CHI-ASH}
  - {at: 60, for: 15, down: CHI-ASH}
  - {at: 90, for: 15, down: CHI-ASH}
